name = "zawar-website"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Let the Worker see every request first (for the .in / www redirect and /api/notify)
run_worker_first = true
not_found_handling = "single-page-application"

[observability]
enabled = true

# Domains served by this Worker (.in and www redirect to zawarfinejewels.com in src/worker.js)
routes = [
  { pattern = "zawarfinejewels.com", custom_domain = true },
  { pattern = "zawarfinejewels.in", custom_domain = true },
  { pattern = "www.zawarfinejewels.in", custom_domain = true },
  { pattern = "www.zawarfinejewels.com/*", zone_name = "zawarfinejewels.com" },
]

[vars]
SUPABASE_URL = "https://gygznkqpqdqrlyyocknr.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY is a secret set in the Cloudflare dashboard (never commit it)
