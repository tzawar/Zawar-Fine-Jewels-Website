name = "zawar-website"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Let the Worker see every request first (for the .in / www redirect and /api/notify)
run_worker_first = true
not_found_handling = "single-page-application"

[observability]
enabled = true

# Custom domains are added in the Cloudflare dashboard once the domains are on Cloudflare:
#   zawarfinejewels.com, www.zawarfinejewels.com, zawarfinejewels.in, www.zawarfinejewels.in

[vars]
SUPABASE_URL = "https://gygznkqpqdqrlyyocknr.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY is a secret set in the Cloudflare dashboard (never commit it)
